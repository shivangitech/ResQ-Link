<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQ-link — P2P Emergency Response</title>
  <style>
    :root {
      --primary: #d946ef;
      --bg: #fdf4ff;
      --card-bg: #ffffff;
      --text: #374151;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      color: var(--primary);
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #1f2937;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    canvas {
      width: 100%;
      height: 150px;
      background: #111827;
      border-radius: 8px;
    }
    .log-item {
      border-left: 4px solid var(--primary);
      background: #faf5ff;
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
    }
    .badge-red {
      background: #ef4444;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
    }
  </style>
  
  <!-- Firebase Scripts (Backend Layer) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="header">
    <h1>🩷 ResQ-link</h1>
    <p>Offline-First P2P Emergency Response Network</p>
  </div>

  <div class="container">
    
    <!-- 1. Canvas Mesh Visualizer -->
    <div class="card">
      <h2>Live Peer-to-Peer Mesh Visualizer</h2>
      <canvas id="meshCanvas"></canvas>
    </div>

    <!-- 2. AI Triage Calculator -->
    <div class="card">
      <h2>Offline AI Medical Triage Calculator</h2>
      <label>Breathing Condition:</label>
      <select id="breathing">
        <option value="Normal">Normal</option>
        <option value="Severe Distress">Severe Distress / Absent</option>
      </select>
      
      <label>Consciousness Level:</label>
      <select id="consciousness">
        <option value="Conscious">Alert / Conscious</option>
        <option value="Unresponsive">Unresponsive / Fainting</option>
      </select>
      
      <button onclick="calculateTriage()">Compute AI Priority Level</button>
      <div id="triageResult" style="margin-top:10px; font-weight:bold;"></div>
    </div>

    <!-- 3. Emergency SOS Dispatcher -->
    <div class="card">
      <h2>Emergency SOS Dispatcher</h2>
      <input type="text" id="nodeId" placeholder="Sender Name / Node ID (e.g. Node-404, Flat 2A)" />
      <textarea id="sosMsg" rows="3" placeholder="Emergency Message & Location Details..."></textarea>
      <button onclick="dispatchSOS()">Relay SOS Over Mesh</button>
    </div>

    <!-- 4. Realtime Command Center (Backend Live Stream) -->
    <div class="card">
      <h2>Live Responder Command Center</h2>
      <div id="commandCenterLogs">
        <p style="color:#6b7280; font-size: 0.9rem;">Waiting for incoming broadcasts...</p>
      </div>
    </div>

  </div>

  <script>
    // 1. FIREBASE BACKEND SETUP (Realtime Synchronization)
    const firebaseConfig = {
      databaseURL: "https://resq-link-demo-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 2. SOS DISPATCH FUNCTION (Data bhejta hai)
    function dispatchSOS() {
      const node = document.getElementById('nodeId').value || "Anonymous Node";
      const msg = document.getElementById('sosMsg').value || "Emergency SOS Triggered!";
      
      if(!msg) {
        alert("Please write a message!");
        return;
      }

      // Firebase database mein save karna (Live broadcast to all devices)
      database.ref('sos_alerts').push({
        nodeId: node,
        message: msg,
        timestamp: new Date().toLocaleTimeString()
      });

      alert("🚨 Distress signal broadcasted across local P2P Mesh nodes!");
      document.getElementById('sosMsg').value = "";
    }

    // 3. LIVE RECEIVER (Dost ke phone par real-time update karta hai)
    database.ref('sos_alerts').on('child_added', (snapshot) => {
      const data = snapshot.val();
      const logsContainer = document.getElementById('commandCenterLogs');

      // Clear default placeholder text
      if (logsContainer.innerHTML.includes("Waiting for incoming")) {
        logsContainer.innerHTML = "";
      }

      const logElement = document.createElement('div');
      logElement.className = 'log-item';
      logElement.innerHTML = `
        <div style="display:flex; justify-between; align-items:center;">
          <strong>ID: ${data.nodeId}</strong>
          <span class="badge-red">CRITICAL</span>
        </div>
        <p style="margin:5px 0;">${data.message}</p>
        <small style="color:#6b7280;">Received at: ${data.timestamp}</small>
      `;
      logsContainer.prepend(logElement);
    });

    // 4. AI TRIAGE LOGIC
    function calculateTriage() {
      const b = document.getElementById('breathing').value;
      const c = document.getElementById('consciousness').value;
      const resultDiv = document.getElementById('triageResult');

      if (b === "Severe Distress" || c === "Unresponsive") {
        resultDiv.innerHTML = "<span style='color:red;'>CATEGORY RED (IMMEDIATE) - Life Threat Detected!</span>";
      } else {
        resultDiv.innerHTML = "<span style='color:green;'>CATEGORY GREEN (DELAYED) - Stable Condition.</span>";
      }
    }

    // 5. CANVAS MESH ANIMATION LOGIC
    const canvas = document.getElementById('meshCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    const nodes = [
      {x: 50, y: 50}, {x: 180, y: 80}, {x: 120, y: 120}, {x: 280, y: 40}
    ];

    function drawMesh() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#d946ef';
      ctx.fillStyle = '#d946ef';

      for (let i = 0; i < nodes.length; i++) {
        ctx.beginPath();
        ctx.arc(nodes[i].x, nodes[i].y, 5, 0, Math.PI * 2);
        ctx.fill();

        for (let j = i + 1; j < nodes.length; j++) {
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.stroke();
        }
      }
    }
    drawMesh();
  </script>
</body>
</html>
